---
layout: default
---

<section style="margin:0 0 36px;padding:24px;border:1px solid #e7ded5;border-radius:8px;background:#fbfaf7;">
  <div style="font-size:13px;color:#a75237;letter-spacing:2px;">古今一念间 · 文章目录</div>
  <h1 style="margin:10px 0;font-size:25px;line-height:1.4;">历史故事与人物选择</h1>
  <p style="margin:0 0 16px;line-height:1.8;">已发布的公众号文章，按系列整理在这里。</p>
  <a href="/wechat/" style="display:inline-block;padding:10px 18px;border-radius:6px;background:#243247;color:#fff;text-decoration:none;">查看文章目录 →</a>
</section>

<div class="posts">
  {% for post in site.posts %}
    <article class="post">

      <h1><a href="{{ site.baseurl }}{{ post.url }}">{{ post.title }}</a></h1>

      <div class="entry">
        {{ post.excerpt }}
      </div>

      <a href="{{ site.baseurl }}{{ post.url }}" class="read-more">Read More</a>
    </article>
  {% endfor %}
</div>
