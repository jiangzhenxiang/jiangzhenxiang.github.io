<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="description" content="古今一念间的公众号文章目录：马斯克的选择、历史与生活、历史地图。">
  <title>文章目录｜古今一念间</title>
  <style>
    *{box-sizing:border-box}body{margin:0;background:#f5f2ed;color:#243247;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}a{color:inherit;text-decoration:none}a:focus-visible{outline:3px solid #d95436;outline-offset:4px}.wrap{width:min(100% - 32px,760px);margin:auto}.top{padding:28px 0 0;font-size:14px;color:#756f68}.top a:hover{color:#d95436}header{padding:58px 0 42px;border-bottom:1px solid #ddd7cf}.eyebrow{color:#b45338;font-size:12px;font-weight:700;letter-spacing:3px}h1{font-size:clamp(34px,7vw,52px);line-height:1.2;margin:14px 0}header p{font-size:16px;color:#6d6964;line-height:1.9;margin:0}.group{padding:35px 0 8px}.group h2{font-size:21px;margin:0 0 8px}.group>p{color:#77716b;font-size:14px;margin:0 0 18px;line-height:1.7}.card{display:block;background:#fff;border:1px solid #e8e3dc;border-radius:8px;padding:22px 24px;margin:0 0 12px;box-shadow:0 3px 13px rgba(35,42,50,.025);transition:transform .18s,box-shadow .18s}.card:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(35,42,50,.09)}.meta{font-size:12px;font-weight:700;color:#b45338;letter-spacing:1px}.title{display:block;font-size:19px;font-weight:650;line-height:1.55;margin:7px 0}.desc{font-size:14px;color:#77716b;line-height:1.7}.arrow{float:right;color:#b45338}footer{padding:35px 0 50px;color:#948e87;font-size:13px}@media(max-width:520px){header{padding:43px 0 32px}.card{padding:19px}.title{font-size:17px}}
  </style>
</head>
<body>
  <div class="wrap">
    <nav class="top"><a href="/">← 返回网站首页</a></nav>
    <header><div class="eyebrow">古今一念间 / ARTICLES</div><h1>文章目录</h1><p>从历史看人性、命运与选择。<br>这里收录已发布的公众号文章。</p></header>
    <main id="articles" aria-live="polite"><p class="notice" style="padding:35px 0;color:#77716b;">正在读取文章…</p></main>
    <footer>古今一念间 · 文章目录</footer>
  </div>
  <script>
    // Pages 构建时列出文章文件，浏览器读取每篇页面中的真实标题。
    const files = [
      {% for file in site.static_files %}{% if file.path contains '/wechat/' and file.path contains '/index.html' %}{{ file.path | remove: 'index.html' | relative_url | jsonify }},
      {% endif %}{% endfor %}
      {% for article in site.pages %}{% if article.path contains 'wechat/' and article.path contains '/index.html' %}{{ article.path | remove: 'index.html' | relative_url | jsonify }},
      {% endif %}{% endfor %}
    ];
    const paths = [...new Set(files)].filter(path => /\/wechat\/[^/]+\/$/.test(path));
    const groups = [
      {name:'马斯克的选择', test:slug=>slug.startsWith('musk-')},
      {name:'历史与生活', test:slug=>slug.startsWith('alcohol-')},
      {name:'历史地图', test:slug=>slug.startsWith('china-territory-')},
      {name:'更多文章', test:()=>true}
    ];
    const main = document.getElementById('articles');
    Promise.all(paths.map(async path => {
      const response = await fetch(path);
      if (!response.ok) throw new Error(`${path}: ${response.status}`);
      const page = new DOMParser().parseFromString(await response.text(), 'text/html');
      const title = page.querySelector('#article-title, h1')?.textContent.trim();
      if (!title) throw new Error(`${path}: 找不到文章标题`);
      return {path, title, slug:path.split('/').filter(Boolean).at(-1)};
    })).then(articles => {
      main.replaceChildren();
      if (!articles.length) { main.innerHTML = '<p class="notice">还没有发布文章。</p>'; return; }
      for (const group of groups) {
        const items = articles.filter(article => group.test(article.slug) && groups.find(g => g.test(article.slug)) === group)
          .sort((a,b) => a.slug.localeCompare(b.slug, 'zh-CN', {numeric:true}));
        if (!items.length) continue;
        const section = document.createElement('section');
        section.className = 'group';
        const heading = document.createElement('h2'); heading.textContent = group.name; section.append(heading);
        for (const article of items) {
          const link = document.createElement('a'); link.className = 'card'; link.href = article.path;
          const meta = document.createElement('span'); meta.className = 'meta';
          const number = article.slug.match(/-(\d+)$/)?.[1];
          meta.textContent = number ? `${number} · ${group.name}` : group.name;
          const arrow = document.createElement('span'); arrow.className = 'arrow'; arrow.textContent = '↗';
          const title = document.createElement('span'); title.className = 'title'; title.textContent = article.title;
          link.append(meta, arrow, title); section.append(link);
        }
        main.append(section);
      }
    }).catch(error => {
      console.error('读取文章目录失败', error);
      main.innerHTML = '<p class="notice">文章目录暂时无法读取，请稍后刷新页面。</p>';
    });
  </script>
</body>
</html>
